services:
  - type: web
    name: table-reservation
    runtime: python
    plan: free
    buildCommand: |
      python -m unittest discover -s tests
    startCommand: python3 -m app.server
    envVars:
      - key: ADMIN_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_WEBHOOK_URL
        sync: false
      - key: WHATSAPP_RECIPIENT
        value: "0617461487"
